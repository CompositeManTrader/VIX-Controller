# Tema nativo alineado a la paleta del dashboard (:root en app.py).
# Esto hace que los widgets nativos de Streamlit (sliders, botones,
# selectboxes, dataframes, spinners) usen los colores del design system
# en lugar del rojo default de Streamlit.
[theme]
base = "dark"
primaryColor = "#F7931A"
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#161B22"
textColor = "#C9D1D9"

[server]
headless = true

[browser]
gatherUsageStats = false
