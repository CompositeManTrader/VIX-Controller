# Tema nativo alineado a la paleta del dashboard (:root en app.py).
# Estética sobria de plataforma premium: navy profundo, acento dorado
# apagado, sin brillos. Los widgets nativos (sliders, botones, selects,
# dataframes, spinners) heredan estos colores.
[theme]
base = "dark"
primaryColor = "#C9A227"
backgroundColor = "#0B0F14"
secondaryBackgroundColor = "#11161D"
textColor = "#D7DEE7"

[server]
headless = true

[browser]
gatherUsageStats = false
