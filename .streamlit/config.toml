# Tema nativo alineado con Spread Trading Club · "Terminal Pro".
# Negro, un solo acento ámbar. Los widgets nativos heredan estos colores;
# el resto del sistema visual vive en vix_controller/ui/theme.py.
[theme]
base = "dark"
primaryColor = "#F5A623"
backgroundColor = "#0A0B0D"
secondaryBackgroundColor = "#15171A"
textColor = "#F4F5F6"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
