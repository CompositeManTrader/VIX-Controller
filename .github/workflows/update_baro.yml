name: Update Barómetro Parquet

on:
  schedule:
    # Lunes-Viernes a las 22:00 UTC (17:00 ET, tras cierre de NYSE)
    # NYSE cierra a las 16:00 ET, damos 1h de buffer para que Yahoo actualice
    - cron: '0 22 * * 1-5'
  workflow_dispatch:   # permite ejecutar manualmente desde GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance>=0.2.48 pandas>=2.2.0 pyarrow>=14.0.0 curl_cffi>=0.6.0

      - name: Run update script
        timeout-minutes: 10
        run: python scripts/update_baro_parquet.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/baro_history.parquet

          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
            exit 0
          fi

          git commit -m "Auto: update baro_history.parquet [$(date +%F)]"

          # Retry push con rebase si alguien pusheó mientras corría el job
          for attempt in 1 2 3; do
            if git push; then
              echo "✅ Committed and pushed (intento $attempt)"
              exit 0
            fi
            echo "⚠️ Push falló (intento $attempt) — reintentando con pull --rebase"
            git pull --rebase origin main || true
            sleep 5
          done

          echo "❌ Push falló después de 3 intentos"
          exit 1
